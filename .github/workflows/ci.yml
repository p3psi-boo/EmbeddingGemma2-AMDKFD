name: CPU checks and GPU cross-build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch checksum-locked Nix installer
        run: scripts/fetch-nix-installer.sh "$RUNNER_TEMP/nix-install"
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2, peeled commit
        with:
          install_url: file://${{ runner.temp }}/nix-install
          enable_kvm: false
      - name: Verify bootstrap Nix version
        run: test "$(nix --version)" = 'nix (Nix) 2.35.3'
      - name: Public source hygiene
        run: nix develop --no-update-lock-file -c python3 scripts/public_repo.py check
      - name: Publication regression tests
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Secret scan
        run: nix develop --no-update-lock-file -c gitleaks dir --redact --no-banner .
      - name: Shell and Python syntax
        run: |
          nix develop --no-update-lock-file -c bash -c '
            set -e
            for script in scripts/*.sh; do bash -n "$script"; done
            python3 -m compileall -q scripts tests
          '
      - name: Build package and run CPU tests
        run: nix build --no-update-lock-file --print-build-logs
      - name: Check installed license notices
        run: |
          test -s result/share/licenses/embeddinggemma-kfd/LICENSE
          test -s result/share/licenses/embeddinggemma-kfd/libkfd-LICENSE
          test -s result/share/licenses/embeddinggemma-kfd/embeddinggemma.c-LICENSE
