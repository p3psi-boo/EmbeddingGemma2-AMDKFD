name: CPU checks and GPU cross-build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - name: Public source hygiene
        run: python3 scripts/public_repo.py check
      - name: Publication regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Secret scan
        run: nix develop -c gitleaks dir --redact --no-banner .
      - name: Shell and Python syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m compileall -q scripts tests
      - name: Build package and run CPU tests
        run: nix build --print-build-logs
      - name: Check installed license notices
        run: |
          test -s result/share/licenses/embeddinggemma-kfd/LICENSE
          test -s result/share/licenses/embeddinggemma-kfd/libkfd-LICENSE
          test -s result/share/licenses/embeddinggemma-kfd/embeddinggemma.c-LICENSE
